<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 48" width="160" height="48">
  <defs>
    <linearGradient id="flacCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#4FACFE" stop-opacity="0.08"/>
    </linearGradient>
  </defs>
  
  <!-- Pill Substrate -->
  <rect x="1" y="1" width="158" height="46" rx="23" fill="url(#flacCyan)" stroke="#00F2FE" stroke-width="1.2" stroke-opacity="0.7"/>
  
  <!-- FLAC Codec Mark -->
  <text x="22" y="30" font-family="'JetBrainsMono', monospace" font-size="14" font-weight="900" fill="#00F2FE" letter-spacing="1">FLAC</text>
  
  <!-- Divider -->
  <line x1="72" y1="14" x2="72" y2="34" stroke="#00F2FE" stroke-opacity="0.3" stroke-width="1"/>
  
  <!-- Lossless / Studio Text -->
  <text x="82" y="29" font-family="'PlusJakartaSans', sans-serif" font-size="11.5" font-weight="700" fill="#FFFFFF" fill-opacity="0.9" letter-spacing="0.5">STUDIO</text>
</svg>
