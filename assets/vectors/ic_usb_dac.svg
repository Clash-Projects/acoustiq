<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- USB-C Connector Plug -->
  <rect x="25" y="6" width="14" height="10" rx="3.5" fill="none" stroke="#E2E8F0" stroke-width="2.2"/>
  <line x1="29" y1="11" x2="35" y2="11" stroke="#E2E8F0" stroke-width="1.5" stroke-linecap="round"/>
  
  <!-- Dongle Body (CNC Aluminum Shell) -->
  <rect x="18" y="16" width="28" height="38" rx="6" fill="#14171F" stroke="#38BDF8" stroke-width="2"/>
  
  <!-- Status LED (Bit-Perfect Gold) -->
  <circle cx="32" cy="24" r="2.5" fill="#00E5A3"/>
  
  <!-- 3.5mm / 4.4mm Headphone Jack Port at Bottom -->
  <rect x="28" y="52" width="8" height="6" rx="2" fill="#0F1117" stroke="#94A3B8" stroke-width="1.5"/>
</svg>
