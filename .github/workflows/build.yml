name: Build Android APK (FLAC Toolkit)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release

      - name: Prepare Named APK
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/FLAC-Toolkit-v1.1.0-build${{ github.run_number }}.apk
          cp build/app/outputs/flutter-apk/app-release.apk dist/AcoustiQ-Latest.apk

      - name: Upload APK Artifact (1-Day Retention)
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: FLAC-Toolkit-v1.1.0-build${{ github.run_number }}-APK
          path: dist/*.apk
          retention-days: 1

      - name: Publish to GitHub Releases (Quota-Free Direct Download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: "AcoustiQ Nightly Build"
          body: |
            Automated latest build from commit ${{ github.sha }}.
            Download `AcoustiQ-Latest.apk` directly below.
          files: dist/*.apk
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
