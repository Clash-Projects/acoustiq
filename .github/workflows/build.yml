name: AcoustiQ CI & Release APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Run Static Analyzer
        run: flutter analyze --no-fatal-infos

      - name: Run Unit Tests
        run: flutter test

  build:
    needs: verify
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Decode Release Keystore (if configured)
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > /tmp/acoustiq-release.jks
          echo "ANDROID_KEYSTORE_PATH=/tmp/acoustiq-release.jks" >> $GITHUB_ENV

      - name: Build Release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: flutter build apk --release

      - name: Prepare Named APK
        run: |
          mkdir -p dist
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            cp build/app/outputs/flutter-apk/app-release.apk "dist/AcoustiQ-${{ github.ref_name }}.apk"
          else
            cp build/app/outputs/flutter-apk/app-release.apk "dist/AcoustiQ-v1.1.0-build${{ github.run_number }}.apk"
          fi

      - name: Publish Tagged Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/AcoustiQ-*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prune Obsolete Nightly Assets
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view nightly --json assets --jq '.assets[].name' 2>/dev/null | while read -r asset; do
            if [ -n "$asset" ]; then
              echo "Pruning obsolete nightly asset: $asset"
              gh release delete-asset nightly "$asset" -y || true
            fi
          done || true

      - name: Publish Nightly Pre-Release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: "AcoustiQ Nightly Build"
          body: |
            Automated latest build #${{ github.run_number }} from commit ${{ github.sha }}.
            Download the APK below.
          files: dist/AcoustiQ-*.apk
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
