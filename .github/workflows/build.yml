name: Build Android APK (FLAC Toolkit)

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    # Only build on demand: manual trigger, git version tag, or commit message containing [build], [release], or [apk]
    if: |
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/') ||
      contains(github.event.head_commit.message, '[build]') ||
      contains(github.event.head_commit.message, '[release]') ||
      contains(github.event.head_commit.message, '[apk]')

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release

      - name: Prepare Named APK
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/AcoustiQ-v1.1.0-build${{ github.run_number }}.apk

      - name: Publish to GitHub Releases (Quota-Free Direct Download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: "AcoustiQ Nightly Build"
          body: |
            Automated latest build #${{ github.run_number }} from commit ${{ github.sha }}.
            Download the APK below.
          files: dist/AcoustiQ-v1.1.0-build${{ github.run_number }}.apk
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
